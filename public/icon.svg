<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="10" y="10" rx="105" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Golden Crescent Moon -->
  <path d="M 285 110 A 120 120 0 1 0 350 340 A 100 100 0 1 1 285 110 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Golden Star -->
  <polygon points="360,180 367,202 390,202 371,216 378,238 360,224 342,238 349,216 330,202 353,202" fill="url(#goldGrad)"/>

  <!-- Mosque Silhouette -->
  <!-- Central Dome -->
  <path d="M 180 430 L 180 340 C 180 270 332 270 332 340 L 332 430 Z" fill="#fef3c7" opacity="0.95"/>
  <path d="M 256 250 L 256 270" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="245" r="7" fill="url(#goldGrad)"/>

  <!-- Arch Door -->
  <path d="M 230 430 L 230 380 C 230 360 282 360 282 380 L 282 430 Z" fill="#042f2e"/>

  <!-- Left Minaret -->
  <rect x="110" y="270" width="30" height="160" rx="4" fill="#fef3c7" opacity="0.9"/>
  <polygon points="125,225 110,270 140,270" fill="url(#goldGrad)"/>
  <circle cx="125" cy="220" r="5" fill="url(#goldGrad)"/>

  <!-- Right Minaret -->
  <rect x="372" y="270" width="30" height="160" rx="4" fill="#fef3c7" opacity="0.9"/>
  <polygon points="387,225 372,270 402,270" fill="url(#goldGrad)"/>
  <circle cx="387" cy="220" r="5" fill="url(#goldGrad)"/>
</svg>
